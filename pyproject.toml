[project]
name = "hebbian-mcap"
version = "0.1.2"
description = "Rust-backed MCAP writer for Python with grouped chunks, ROS 2/Foxglove encodings, and optional MCAP-to-MP4 video export"
keywords = ["mcap", "robotics", "ros2", "foxglove", "video", "rust", "pyo3"]
classifiers = [
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: Implementation :: CPython",
    "Programming Language :: Rust",
    "Topic :: Multimedia :: Video",
    "Topic :: Software Development :: Libraries",
]
requires-python = ">=3.11"
license = "Apache-2.0"
license-files = ["LICENSE", "LICENSE-MIT", "NOTICE", "crates/mcap-tools/schemas/LICENSE"]
readme = "README.md"
authors = [{ name = "Hebbian Robotics" }]

[project.optional-dependencies]
video = ["av>=18.1.0", "numpy>=2.3.5", "mcap>=1.4.0", "mcap-protobuf-support>=0.5.4", "mcap-ros2-support>=0.5.7"]

[project.scripts]
mcap-export = "hebbian_mcap.cli:main"

[project.urls]
Documentation = "https://github.com/Hebbian-Robotics/mcap-tools#readme"
Issues = "https://github.com/Hebbian-Robotics/mcap-tools/issues"
Repository = "https://github.com/Hebbian-Robotics/mcap-tools"

[dependency-groups]
dev = ["av>=18.1.0", "numpy>=2.3.5", "maturin>=1.9,<2", "mcap>=1.4", "mcap-protobuf-support>=0.5.4", "mcap-ros2-support>=0.5.7", "pytest>=9", "ruff>=0.16", "ty>=0.0.74"]

[build-system]
requires = ["maturin>=1.9,<2"]
build-backend = "maturin"

[tool.maturin]
include = [{ path = "docs/*.md", format = "sdist" }]
manifest-path = "crates/python/Cargo.toml"
python-source = "python"
module-name = "hebbian_mcap._native"
features = ["pyo3/extension-module"]

[tool.uv]
cache-keys = [{ file = "pyproject.toml" }, { file = "Cargo.toml" }, { file = "Cargo.lock" }, { file = "crates/**/*.rs" }, { file = "crates/**/Cargo.toml" }, { file = "python/**/*.py" }, { file = "python/**/*.pyi" }, { file = "crates/**/schemas/*" }]
exclude-newer = "3 days"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "W", "F", "I", "B", "C4", "C901", "UP", "ANN", "PTH", "RET", "SIM", "TID", "RUF", "PLE", "LOG", "PGH003", "PGH004", "PLW0108", "PLC3002", "PT010", "PT011", "PT012", "PT014", "PT016", "PT017", "PT018", "PT028", "PT030", "PT031", "ASYNC210", "ASYNC220", "ASYNC221", "ASYNC222", "ASYNC230", "ASYNC250", "ASYNC251"]
ignore = ["E501", "ANN401"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff.lint.mccabe]
max-complexity = 15

[tool.ruff.format]
quote-style = "double"
indent-style = "space"

[tool.ty.rules]
division-by-zero = "error"
deprecated = "error"
unused-ignore-comment = "error"
invalid-ignore-comment = "error"
ignore-comment-unknown-rule = "error"
possibly-unresolved-reference = "error"
