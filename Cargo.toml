[workspace]
resolver = "3"
members = ["crates/mcap-tools", "crates/python"]
default-members = ["crates/mcap-tools"]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.92"
license = "Apache-2.0"
repository = "https://github.com/Hebbian-Robotics/mcap-tools"

[workspace.lints.clippy]
pedantic = { level = "warn", priority = -1 }
missing_errors_doc = "allow"
missing_panics_doc = "allow"

[profile.dev]
debug = "line-tables-only"

[profile.release]
# PyO3 catches Rust panics; preserve unwinding at the Python boundary.
lto = "thin"
codegen-units = 1
strip = true
