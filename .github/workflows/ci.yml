name: Validate Rust and Python
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: validate-${{ github.event_name == 'pull_request' && github.ref || github.run_id }}
  cancel-in-progress: true
jobs:
  changes:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
    outputs:
      code: ${{ github.event_name == 'workflow_dispatch' || steps.filter.outputs.code == 'true' }}
      docs: ${{ github.event_name == 'workflow_dispatch' || steps.filter.outputs.docs == 'true' }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: dorny/paths-filter@ceb8a2b8f2d89434be7ff52d3de7ec3738c5cc9d # v4.0.3
        id: filter
        with:
          base: ${{ github.ref }}
          predicate-quantifier: some-with-excludes
          filters: |
            code:
              - '**'
              - '!**/*.md'
              - '!LICENSE*'
              - '!NOTICE*'
            docs:
              - '**/*.md'
              - 'LICENSE*'
              - 'NOTICE*'
  docs:
    needs: changes
    if: needs.changes.outputs.docs == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: lycheeverse/lychee-action@e7477775783ea5526144ba13e8db5eec57747ce8 # v2.9.0
        with:
          output: ${{ runner.temp }}/documentation-links.md
          args: --offline --include-fragments=anchor-only README.md CONTRIBUTING.md docs/*.md crates/mcap-tools/README.md
  native:
    needs: changes
    if: needs.changes.outputs.code == 'true'
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python: ['3.11', '3.14']
    runs-on: ${{ matrix.os }}
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          python-version: ${{ matrix.python }}
          enable-cache: true
          cache-suffix: python-${{ matrix.python }}
          save-cache: ${{ github.ref == 'refs/heads/main' }}
      - name: Restore Rust build cache
        uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          key: ${{ matrix.os }}-python-${{ matrix.python }}
          env-vars: CARGO CC CFLAGS CXX CMAKE RUST PYO3
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - name: Rust checks
        if: matrix.python == '3.11'
        shell: bash
        run: |
          rustup component add clippy rustfmt
          cargo fmt --all --check
          cargo clippy --workspace --locked --all-targets --all-features -- -D warnings
          cargo test --locked
      - name: Python checks
        shell: bash
        run: |
          uv sync --locked
          uv run ruff check
          uv run ruff format --check
          uv run ty check
          uv run pytest -q
      - name: Build and smoke-test distributable wheel
        shell: bash
        run: |
          uv run maturin build --release --locked --out dist
          uv venv wheel-test
          uv pip install --python wheel-test dist/*.whl
          uv run --python wheel-test --no-project python -c 'from importlib.util import find_spec; assert find_spec("av") is None and find_spec("numpy") is None; from io import BytesIO; from hebbian_mcap import GroupedMcapWriter; stream = BytesIO(); writer = GroupedMcapWriter(stream); writer.finish(); assert stream.getvalue().endswith(b"MCAP0\r\n")'
