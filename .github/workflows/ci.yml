name: Validate Rust and Python
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  native:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python: ['3.11', '3.14']
    runs-on: ${{ matrix.os }}
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          python-version: ${{ matrix.python }}
      - name: Rust checks
        if: matrix.python == '3.11'
        shell: bash
        run: |
          rustup component add clippy rustfmt
          cargo fmt --all --check
          cargo clippy --workspace --locked --all-targets --all-features -- -D warnings
          cargo test --locked
      - name: Python checks
        shell: bash
        run: |
          uv sync --locked
          uv run ruff check
          uv run ruff format --check
          uv run ty check
          uv run pytest -q
      - name: Build and smoke-test distributable wheel
        shell: bash
        run: |
          uv run maturin build --release --locked --out dist
          uv venv wheel-test
          uv pip install --python wheel-test dist/*.whl
          uv run --python wheel-test --no-project python -c 'from importlib.util import find_spec; assert find_spec("av") is None and find_spec("numpy") is None; from io import BytesIO; from hebbian_mcap import GroupedMcapWriter; stream = BytesIO(); writer = GroupedMcapWriter(stream); writer.finish(); assert stream.getvalue().endswith(b"MCAP0\r\n")'
