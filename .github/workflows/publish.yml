name: Build and publish Python wheels

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      publish:
        description: Publish the built distributions to PyPI
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  wheels:
    strategy:
      fail-fast: false
      matrix:
        include:
          - {os: ubuntu-latest, target: x86_64-unknown-linux-gnu, manylinux: '2014'}
          - {os: ubuntu-24.04-arm, target: aarch64-unknown-linux-gnu, manylinux: '2014'}
          - {os: macos-latest, target: x86_64-apple-darwin, manylinux: auto}
          - {os: macos-latest, target: aarch64-apple-darwin, manylinux: auto}
          - {os: windows-latest, target: x86_64-pc-windows-msvc, manylinux: auto}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          python-version: '3.11'
      - name: Build portable ABI3 wheel
        uses: PyO3/maturin-action@e83996d129638aa358a18fbd1dfb82f0b0fb5d3b # v1
        with:
          target: ${{ matrix.target }}
          manylinux: ${{ matrix.manylinux }}
          maturin-version: '1.16.0'
          args: --release --locked --out dist --interpreter python3.11
      - name: Smoke-test native wheel without building dependencies
        if: matrix.target != 'x86_64-apple-darwin'
        shell: bash
        run: |
          uv venv wheel-test
          uv pip install --python wheel-test --only-binary :all: dist/*.whl
          uv run --python wheel-test --no-project python -c 'from io import BytesIO; from hebbian_mcap import GroupedMcapWriter; stream = BytesIO(); writer = GroupedMcapWriter(stream); writer.finish(); assert stream.getvalue().endswith(b"MCAP0\r\n")'
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: wheels-${{ matrix.target }}
          path: dist/*.whl
          if-no-files-found: error

  source:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
      - name: Check tag version and build source distribution
        shell: bash
        run: |
          if [[ "$GITHUB_REF" == refs/tags/* ]]; then
            test "$GITHUB_REF_NAME" = "v$(uv version --short)"
          fi
          uv build --sdist
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: source-distribution
          path: dist/*.tar.gz
          if-no-files-found: error

  publish:
    if: startsWith(github.ref, 'refs/tags/') || inputs.publish == true
    needs: [wheels, source]
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/p/hebbian-mcap
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          path: dist
          merge-multiple: true
      - uses: pypa/gh-action-pypi-publish@7245906fb61fa33a13554f9d5fb856fe61758086 # v1.14.3
